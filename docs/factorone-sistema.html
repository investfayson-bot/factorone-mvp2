<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FactorOne — Estrutura do Sistema (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F7F5; --bg-2:#ECF2EE; --surface:#FFFFFF; --surface-2:#F7FAF8;
    --ink:#0A1A13; --ink-soft:#37473F; --mut:#66756D; --mut-2:#98A59E;
    --line:#E4EBE7; --line-soft:#EEF3F0;
    --green:#00A868; --green-deep:#047A50; --green-bright:#12C27E; --green-ink:#064E36;
    --green-tint:#E6F6EE; --green-tint-2:#D3EFE0;
    --good:#047A50; --good-bg:#E6F6EE;
    --warn:#B45309; --warn-bg:#FCF1E1;
    --crit:#C5443E; --crit-bg:#FCEAE8;
    --blue:#2563C9; --blue-bg:#E8F0FC;
    --purple:#5B57C7; --purple-bg:#ECEBFA;
    --shadow-xs:0 1px 2px rgba(10,26,19,.05);
    --shadow:0 1px 2px rgba(10,26,19,.05),0 6px 20px rgba(10,26,19,.05);
    --shadow-md:0 2px 6px rgba(10,26,19,.06),0 14px 40px rgba(10,26,19,.09);
    --shadow-lg:0 30px 70px rgba(6,78,54,.18);
    --r-lg:20px; --r:14px; --r-sm:10px;
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --display:'Inter Tight','Inter',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#D5DED8;border-radius:20px;border:3px solid var(--bg)}

  /* ---------- APP SHELL ---------- */
  .app{display:grid;grid-template-columns:256px 1fr;min-height:100vh}

  /* ---------- SIDEBAR ---------- */
  .side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
  .side-top{padding:18px 18px 8px}
  .brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.02em}
  .brand .mark{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--green-bright),var(--green-deep));display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;box-shadow:0 4px 12px rgba(0,168,104,.35)}
  .brand .dot{color:var(--green)}
  .company{margin:14px 0 4px;display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);cursor:pointer}
  .company .logo{width:26px;height:26px;border-radius:8px;background:var(--green-ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex-shrink:0}
  .company .nm{flex:1;min-width:0}
  .company .nm b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .company .nm span{font-size:10.5px;color:var(--mut);font-family:var(--mono)}
  .company .cv{color:var(--mut-2);font-size:11px}

  .nav{flex:1;overflow-y:auto;padding:6px 12px 12px}
  .nav-grp{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--mut-2);font-weight:600;padding:16px 10px 7px}
  .nav-i{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;font-size:13.5px;color:var(--ink-soft);cursor:pointer;font-weight:500;transition:background .12s}
  .nav-i:hover{background:var(--surface-2)}
  .nav-i .ic{width:19px;text-align:center;color:var(--mut);font-size:15px;flex-shrink:0}
  .nav-i .lbl{flex:1}
  .nav-i .cnt{font-family:var(--mono);font-size:10px;background:var(--green-tint);color:var(--green-deep);padding:1px 7px;border-radius:999px;font-weight:600}
  .nav-i.active{background:var(--green-ink);color:#fff}
  .nav-i.active .ic{color:var(--green-bright)}
  .nav-i.active .cnt{background:rgba(255,255,255,.16);color:#fff}

  .side-user{border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
  .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#12C27E,#047A50);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0}
  .side-user .u{flex:1;min-width:0}
  .side-user .u b{display:block;font-size:12.5px;font-weight:600}
  .side-user .u span{font-size:10.5px;color:var(--mut)}

  /* ---------- MAIN ---------- */
  .main{min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(244,247,245,.82);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);padding:14px 30px;display:flex;align-items:center;gap:16px}
  .crumb{font-family:var(--mono);font-size:11px;color:var(--mut);letter-spacing:.02em}
  .crumb b{color:var(--ink)}
  .topbar h1{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.02em;margin:0}
  .live{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--green-deep);background:var(--green-tint);border:1px solid var(--green-tint-2);padding:4px 10px;border-radius:999px;font-weight:600}
  .live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(0,168,104,.2);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--mut);font-size:12.5px;width:230px;box-shadow:var(--shadow-xs)}
  .tb-ic{width:36px;height:36px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-soft);box-shadow:var(--shadow-xs);cursor:pointer}

  .subtabs{display:flex;gap:6px;padding:14px 30px 0;flex-wrap:wrap}
  .subtab{font-size:12.5px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);cursor:pointer;font-weight:500;box-shadow:var(--shadow-xs);white-space:nowrap}
  .subtab:hover{border-color:var(--green-tint-2)}
  .subtab.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  .content{padding:22px 30px 48px}

  /* ---------- GENERIC UI ---------- */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
  .kpi .l{font-size:11.5px;color:var(--mut);font-weight:500;display:flex;align-items:center;gap:7px}
  .kpi .l .d{width:8px;height:8px;border-radius:3px;background:var(--green)}
  .kpi .v{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:9px;font-variant-numeric:tabular-nums}
  .kpi .c{font-size:11.5px;margin-top:4px;font-weight:600}
  .kpi .c.up{color:var(--good)} .kpi .c.warn{color:var(--warn)} .kpi .c.mut{color:var(--mut)}

  .grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .card-h{padding:15px 18px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between}
  .card-h b{font-size:14px;font-weight:700;letter-spacing:-.01em}
  .card-h .mini{font-family:var(--mono);font-size:10.5px;color:var(--mut)}
  .card-b{padding:16px 18px}

  .dre-row{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line-soft);font-size:13px}
  .dre-row:first-child{border-top:none}
  .dre-row.tot{font-weight:700;color:var(--ink)}
  .dre-row .neg{color:var(--crit);font-variant-numeric:tabular-nums}
  .dre-row .pos{color:var(--good);font-variant-numeric:tabular-nums;font-weight:600}
  .dre-row .num{font-variant-numeric:tabular-nums}
  .dre-row.hl{background:var(--green-tint);margin:2px -8px;padding:9px 8px;border-radius:8px;border:none}

  .txn{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line-soft)}
  .txn:first-child{border-top:none}
  .txn .ic{width:34px;height:34px;border-radius:10px;background:var(--green-tint);color:var(--green-deep);display:grid;place-items:center;font-size:13px;flex-shrink:0}
  .txn .m{flex:1;min-width:0}
  .txn .m b{display:block;font-size:12.5px;font-weight:600}
  .txn .m span{font-size:11px;color:var(--mut)}
  .txn .val{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
  .txn .val.in{color:var(--good)} .txn .val.out{color:var(--ink)}
  .tag-st{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:5px;font-weight:600}
  .tag-st.ok{background:var(--good-bg);color:var(--good)}
  .tag-st.pend{background:var(--warn-bg);color:var(--warn)}

  /* chart */
  .chart{display:flex;align-items:flex-end;gap:14px;height:150px;padding:8px 4px 0}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
  .bar-pair{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center}
  .bar{width:12px;border-radius:4px 4px 0 0}
  .bar.inb{background:linear-gradient(180deg,var(--green-bright),var(--green))}
  .bar.outb{background:#E4EBE7}
  .bar-col .mo{font-family:var(--mono);font-size:10px;color:var(--mut)}
  .legend{display:flex;gap:16px;font-size:11px;color:var(--mut);margin-top:6px}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}

  /* bank home */
  .bank-hero{background:linear-gradient(150deg,#06623F,#043D28 90%);border-radius:var(--r-lg);padding:24px 26px;color:#EAF6F0;box-shadow:var(--shadow-md);position:relative;overflow:hidden}
  .bank-hero::after{content:"";position:absolute;right:-50px;top:-50px;width:240px;height:240px;background:radial-gradient(circle,rgba(18,194,126,.35),transparent 65%)}
  .bank-hero .rel{position:relative;z-index:1}
  .bh-top{display:flex;justify-content:space-between;align-items:flex-start}
  .bh-lab{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
  .bh-bal{font-family:var(--display);font-size:42px;font-weight:800;letter-spacing:-.03em;margin-top:6px;font-variant-numeric:tabular-nums}
  .bh-bal small{font-size:22px;opacity:.7}
  .bh-agg{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .bh-agg .b{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:11px 15px;min-width:130px}
  .bh-agg .b span{font-family:var(--mono);font-size:9.5px;opacity:.72;text-transform:uppercase;letter-spacing:.05em;display:block}
  .bh-agg .b b{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;display:block}
  .bh-eye{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:14px;cursor:pointer}

  .qa-row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:16px}
  .qa2{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 10px;text-align:center;box-shadow:var(--shadow-xs);cursor:pointer;position:relative}
  .qa2 .ic{width:42px;height:42px;margin:0 auto 8px;border-radius:13px;background:var(--green-tint);color:var(--green-deep);display:grid;place-items:center;font-size:17px}
  .qa2 .t{font-size:12px;font-weight:600}
  .qa2 .lock{position:absolute;top:8px;right:8px;font-family:var(--mono);font-size:8.5px;background:var(--warn-bg);color:var(--warn);padding:2px 6px;border-radius:5px;font-weight:700}

  .ccards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .vcard{border-radius:var(--r);padding:16px;color:#fff;background:linear-gradient(135deg,#05341F,#06623F 60%,#12C27E);box-shadow:0 8px 22px rgba(6,78,54,.28);position:relative;overflow:hidden}
  .vcard.alt{background:linear-gradient(135deg,#052B3A,#0B4A63 60%,#2BB3D6)}
  .vcard.alt2{background:linear-gradient(135deg,#3A2B05,#7A5A0B 60%,#D6A52B)}
  .vc-top{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;opacity:.9;letter-spacing:.06em}
  .vc-num{font-family:var(--mono);font-size:14px;letter-spacing:.14em;margin-top:22px}
  .vc-bot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px}
  .vc-bot .l{font-family:var(--mono);font-size:8.5px;opacity:.8;text-transform:uppercase}
  .vc-bot .v{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
  .vc-bar{height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin-top:12px;overflow:hidden}
  .vc-bar i{display:block;height:100%;background:#fff;border-radius:3px}

  .bank-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}

  .conn{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line-soft)}
  .conn:first-child{border-top:none}
  .conn .lg{width:38px;height:38px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--green-deep);flex-shrink:0}
  .conn .m{flex:1}
  .conn .m b{display:block;font-size:13px;font-weight:600}
  .conn .m span{font-size:11px;color:var(--mut)}

  /* pipeline */
  .pipe{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .pcol{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r);padding:10px}
  .pcol-h{font-size:11.5px;font-weight:700;padding:6px 8px;display:flex;justify-content:space-between;color:var(--ink-soft)}
  .pcol-h .n{font-family:var(--mono);font-size:10px;color:var(--mut);background:var(--surface);border:1px solid var(--line);padding:1px 7px;border-radius:999px}
  .deal{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-top:8px;box-shadow:var(--shadow-xs)}
  .deal b{font-size:12.5px;display:block;font-weight:600}
  .deal .v{font-family:var(--mono);font-size:12px;color:var(--green-deep);font-weight:600;margin-top:5px}
  .deal .who{font-size:10.5px;color:var(--mut);margin-top:3px}

  /* CFO chat */
  .chat{max-width:720px}
  .msg{display:flex;gap:12px;margin-bottom:16px}
  .msg .ava{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#12C27E,#047A50);color:#fff;display:grid;place-items:center;flex-shrink:0;font-size:15px}
  .msg .bub{background:var(--surface);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:14px 16px;box-shadow:var(--shadow);font-size:13.5px;color:var(--ink-soft)}
  .msg.me{flex-direction:row-reverse}
  .msg.me .ava{background:var(--green-ink)}
  .msg.me .bub{background:var(--green-ink);color:#EAF6F0;border-radius:14px 4px 14px 14px;border-color:transparent}
  .chatbox{display:flex;gap:10px;margin-top:8px;max-width:720px}
  .chatbox input{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px 15px;font-family:var(--sans);font-size:13.5px;outline:none;background:var(--surface)}
  .chatbox input:focus{border-color:var(--green)}
  .chatbox .send{background:var(--green);color:#fff;border:none;border-radius:12px;padding:0 20px;font-weight:600;font-size:13.5px;cursor:pointer;font-family:var(--sans)}

  /* placeholder module */
  .modh{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px}
  .modh .bi{width:44px;height:44px;border-radius:12px;background:var(--green-tint);color:var(--green-deep);display:grid;place-items:center;font-size:20px;flex-shrink:0}
  .modh h2{font-family:var(--display);font-size:20px;margin:0 0 3px;letter-spacing:-.02em}
  .modh p{margin:0;color:var(--mut);font-size:13.5px;max-width:64ch}
  .fields{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .fields span{font-family:var(--mono);font-size:10.5px;color:var(--mut);background:var(--surface-2);border:1px solid var(--line);padding:3px 8px;border-radius:6px}
  .skl{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:8px}
  .skl .s{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow-xs)}
  .skl .s .t{font-size:12px;font-weight:600;color:var(--ink-soft)}
  .skl .s .ln{height:8px;border-radius:5px;background:var(--line-soft);margin-top:12px}
  .skl .s .ln.w2{width:70%} .skl .s .ln.w3{width:45%}
  .demo-note{margin-top:22px;font-family:var(--mono);font-size:11px;color:var(--mut);background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:11px 14px}

  .sec-title{font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:-.01em;margin:22px 0 12px;display:flex;align-items:center;gap:9px}
  .sec-title .mini{font-family:var(--mono);font-size:10px;color:var(--mut-2);text-transform:uppercase;letter-spacing:.08em;font-weight:600}

  @media(max-width:1080px){.kpis{grid-template-columns:repeat(2,1fr)}.qa-row{grid-template-columns:repeat(3,1fr)}.ccards{grid-template-columns:1fr}.grid2,.bank-cols,.pipe{grid-template-columns:1fr}}
  @media(max-width:760px){.app{grid-template-columns:1fr}.side{display:none}}
</style>
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="side">
    <div class="side-top">
      <div class="brand"><span class="mark">F</span>FactorOne<span class="dot">.</span></div>
      <div class="company">
        <div class="logo">M</div>
        <div class="nm"><b>Metalúrgica SP Ltda</b><span>CNPJ ••• / 0001-42</span></div>
        <div class="cv">▾</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-grp">Principal</div>
      <div class="nav-i" data-sol="inicio"><span class="ic">◧</span><span class="lbl">Início</span></div>
      <div class="nav-i" data-sol="agentes"><span class="ic">✦</span><span class="lbl">Agentes IA</span><span class="cnt">3</span></div>
      <div class="nav-grp">Soluções</div>
      <div class="nav-i" data-sol="banco"><span class="ic">▣</span><span class="lbl">Banco</span></div>
      <div class="nav-i" data-sol="financeiro"><span class="ic">◈</span><span class="lbl">Financeiro</span></div>
      <div class="nav-i" data-sol="clientes"><span class="ic">◔</span><span class="lbl">Clientes & Vendas</span></div>
      <div class="nav-i" data-sol="contabil"><span class="ic">▦</span><span class="lbl">Contábil & Fiscal</span><span class="cnt">2</span></div>
      <div class="nav-grp">Extras</div>
      <div class="nav-i" data-sol="apps"><span class="ic">⊞</span><span class="lbl">Apps & Marketplace</span></div>
      <div class="nav-i" data-sol="equipe"><span class="ic">◕</span><span class="lbl">Equipe & Planos</span></div>
    </nav>
    <div class="side-user">
      <div class="avatar">V</div>
      <div class="u"><b>Vinícius Santos</b><span>Administrador</span></div>
      <div class="cv" style="color:var(--mut-2)">⚙</div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div>
        <div class="crumb" id="crumb">FactorOne · <b>Início</b></div>
        <h1 id="pageTitle">Visão geral</h1>
      </div>
      <span class="live" id="live">Tempo real</span>
      <div class="search">🔎 Buscar…</div>
      <div class="tb-ic">🔔</div>
    </div>
    <div class="subtabs" id="subtabs"></div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
/* ---------- fake data helpers ---------- */
const BRL = n => "R$ " + n.toLocaleString('pt-BR');

/* ---------- solution config ---------- */

/* ---------- component builders ---------- */
function chart(){
  const d=[[62,48],[70,55],[58,60],[75,52],[80,58],[95,72]];
  const mo=["Mai","Jun","Jul","Ago","Set","Out"];const mx=100;
  return `<div class="chart">`+d.map((p,i)=>`<div class="bar-col"><div class="bar-pair">
    <div class="bar inb" style="height:${p[0]/mx*100}%"></div>
    <div class="bar outb" style="height:${p[1]/mx*100}%"></div></div>
    <div class="mo">${mo[i]}</div></div>`).join('')+`</div>`;
}
function dreRows(full){
  const base=[["Receita Bruta","R$ 2.840.000","","num"],["(-) Deduções e Impostos","−R$ 284.000","neg"],["Receita Líquida","R$ 2.556.000","","tot"],["(-) CMV","−R$ 1.274.000","neg"],["Lucro Bruto","R$ 1.282.000","","hl"]];
  const ext=[["(-) Desp. Operacionais","−R$ 696.000","neg"],["EBITDA","R$ 586.000","","tot"],["(-) Depreciação","−R$ 86.000","neg"],["(-) IR/CSLL","−R$ 151.000","neg"],["Lucro Líquido","R$ 349.000","","hl"]];
  const rows=full?base.concat(ext):base.concat([["EBITDA","R$ 586.000","","tot"],["Lucro Líquido","R$ 349.000","","hl"]]);
  return rows.map(r=>{
    const cls=r[3]==='tot'?'dre-row tot':r[3]==='hl'?'dre-row tot hl':'dre-row';
    const val=r[2]==='neg'?`<span class="neg">${r[1]}</span>`:r[3]==='hl'?`<span class="pos">${r[1]}</span>`:`<span class="num">${r[1]}</span>`;
    return `<div class="${cls}"><span>${r[0]}</span>${val}</div>`;
  }).join('');
}
function txn(ic,t,s,v,dir,st,stt){
  const tag=st?`<span class="tag-st ${st}">${stt}</span>`:'';
  return `<div class="txn"><div class="ic">${ic}</div><div class="m"><b>${t}</b><span>${s}</span></div>${tag}<div class="val ${dir}">${v}</div></div>`;
}
function qa(ic,t,lock){return `<div class="qa2">${lock?`<span class="lock">${lock}</span>`:''}<div class="ic">${ic}</div><div class="t">${t}</div></div>`;}
function conn(lg,t,s){return `<div class="conn"><div class="lg">${lg}</div><div class="m"><b>${t}</b><span>${s}</span></div><div class="cv" style="color:var(--mut-2)">›</div></div>`;}
function pcol(t,n,deals){return `<div class="pcol"><div class="pcol-h">${t}<span class="n">${n}</span></div>`+deals.map(d=>`<div class="deal"><b>${d[0]}</b><div class="v">${d[1]}</div><div class="who">${d[2]}</div></div>`).join('')+`</div>`;}

}

  const apps=[["Omie ERP","✓ Sincronizado"],["Conta Azul","✓ Sincronizado"],["SAP B1","✓ Sincronizado"],["Itaú Empresas","Open Finance"],["BTG Pactual","Open Finance"],["Salesforce","CRM Sync"],["SEFAZ / NF-e","Transmitindo"],["TOTVS","✓ Sincronizado"],["Zapier","Conectar +"]];
  return `<div class="modh"><div class="bi">⊞</div><div><h2>Apps & Marketplace</h2><p>O marketplace liga/desliga capacidades — não vira item de menu solto. Cada app aponta para uma das 6 soluções.</p></div></div>
  <div class="kpis"><div class="kpi"><div class="l">Conectados</div><div class="v">9</div><div class="c up">ativos</div></div><div class="kpi"><div class="l">Sync hoje</div><div class="v">1.248</div><div class="c mut">transações</div></div><div class="kpi"><div class="l">Erros</div><div class="v">0</div><div class="c up">✓ limpo</div></div><div class="kpi"><div class="l">Última sync</div><div class="v">2 min</div><div class="c mut">atrás</div></div></div>
  <div class="card" style="margin-top:16px"><div class="card-h"><b>Integrações ativas</b><span class="mini">nativas</span></div><div class="card-b">${apps.map(a=>conn(a[0].slice(0,2).toUpperCase(),a[0],a[1])).join('')}</div></div>`;
}

/* ---------- render engine ---------- */
let state={sol:"inicio",tab:null};

function render(){
  const cfg=SOL[state.sol];
  document.getElementById('pageTitle').textContent=cfg.title;
  document.getElementById('crumb').innerHTML=`FactorOne · <b>${cfg.crumb}</b>`+(state.tab?` · ${state.tab}`:'');
  // live badge only for realtime-ish views
  document.getElementById('live').style.display=(['banco','financeiro','inicio','agentes','contabil'].includes(state.sol))?'inline-flex':'none';
  // subtabs
  const st=document.getElementById('subtabs');
  if(cfg.tabs.length){
    st.style.display='flex';
    st.innerHTML=cfg.tabs.map(t=>`<div class="subtab ${t===state.tab?'on':''}" data-tab="${t}">${t}</div>`).join('');
    st.querySelectorAll('.subtab').forEach(el=>el.onclick=()=>{state.tab=el.dataset.tab;render();});
  } else { st.style.display='none'; st.innerHTML=''; }
  // content
  const c=document.getElementById('content');
  let html;
  if(state.sol==='inicio') html=P['inicio']();
  else if(state.sol==='apps') html=appsPanel();
  else {
    const key=state.sol+':'+state.tab;
    html = P[key] ? P[key]() : placeholder(state.sol,state.tab);
  }
  c.innerHTML=html;
  c.scrollTo?.(0,0);
  window.scrollTo(0,0);
  // sidebar active
  document.querySelectorAll('.nav-i').forEach(n=>n.classList.toggle('active',n.dataset.sol===state.sol));
}

document.querySelectorAll('.nav-i').forEach(n=>{
  n.onclick=()=>{ state.sol=n.dataset.sol; const cfg=SOL[state.sol]; state.tab=cfg.tabs[0]||null; render(); };
});
render();
</script>
